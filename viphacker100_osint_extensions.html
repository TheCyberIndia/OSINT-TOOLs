* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #00ff41;

body {

  line-height: 1.5;
  padding: 0;
  min-height: 100vh;
}

.terminal-wrap {
  background: var(--bg);
  min-height: 600px;
  padding: 0 0 32px;
}

.scanlines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
}

.header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 1;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.status-dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
}
.dot.red { background: #ff5f56; }
.dot.yellow { background: #ffbd2e; }
.dot.green-d { background: #27c93f; }

.terminal-title {
  font-family: var(--font-display);
  font-size: 9px;
  color: rgba(0,255,65,0.4);
  letter-spacing: 3px;
  text-transform: uppercase;
  flex: 1;
  text-align: center;
}

.main-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  color: var(--green);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(0,255,65,0.5);
  margin-bottom: 4px;
}

.subtitle {
  color: var(--green-dim);
  font-size: 11px;
  letter-spacing: 2px;
}

.prompt-bar {
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--green-dim);
  position: relative;
  z-index: 1;
}

.prompt-symbol { color: var(--green); }

.cursor {
  display: inline-block;
  width: 8px; height: 13px;
  background: var(--green);
  animation: blink 1.1s step-end infinite;
  margin-left: 2px;
  vertical-align: middle;
}

@keyframes blink { 50% { opacity: 0; } }

.stats-row {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 1;
}

.stat-item {
  flex: 1;
  padding: 12px 16px;
  border-right: 1px solid var(--border);
  text-align: center;
}

.stat-item:last-child { border-right: none; }

.stat-num {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--green);
  display: block;
}

.stat-label {
  font-size: 9px;
  color: rgba(0,255,65,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.filter-row {
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 1;
}

.filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: rgba(0,255,65,0.5);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 4px 10px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.15s;
  text-transform: uppercase;
}

.filter-btn:hover,

  background: var(--green-glow);
  border-color: var(--green);
  color: var(--green);
  text-shadow: 0 0 8px rgba(0,255,65,0.6);
}

.search-row {

  position: relative;
  z-index: 1;
}

.search-input {

.search-input::placeholder { color: rgba(0,255,65,0.25); }
.search-input:focus { border-color: var(--green); background: rgba(0,255,65,0.06); }

.content {
  padding: 20px 24px;

  z-index: 1;

.section-label {

}

.section-label::after {
  content: '';

  height: 1px;
  background: var(--border);
}

.category-block {

}

.category-header {

  gap: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  padding: 6px 0;

.cat-icon {

}

.cat-name {

.cat-count {

  padding: 1px 6px;
}

.toggle-arrow {
  font-size: 10px;
  color: rgba(0,255,65,0.4);
  transition: transform 0.2s;
}

.category-header.collapsed .toggle-arrow { transform: rotate(-90deg); }

.ext-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.ext-card {
  background: var(--card-bg);

  padding: 10px 12px;
  position: relative;
  transition: border-color 0.15s, background 0.15s;
  overflow: hidden;
}

.ext-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 2px; height: 100%;
  background: var(--green-dim);
  opacity: 0;
  transition: opacity 0.15s;
}

.ext-card:hover {
  border-color: var(--green);
  background: rgba(0,255,65,0.04);
}

.ext-card:hover::before { opacity: 1; }

.ext-name {

  font-weight: 500;
  margin-bottom: 4px;

  justify-content: space-between;

.ext-link {

.ext-link:hover {

.ext-desc {

.hidden { display: none !important; }

.no-results {

.glitch {

@keyframes glitch {

  96% { text-shadow: 3px 0 0 rgba(255,0,0,0.5), -3px 0 0 rgba(0,234,255,0.5); }
  97% { text-shadow: -2px 0 0 rgba(255,0,0,0.5), 2px 0 0 rgba(0,234,255,0.5); }

let activeFilter = 'all';
let searchQuery = '';

function renderTag(tag) {
  if (!tag) return '';
  const map = { ai: ['tag-ai','AI'], opsec: ['tag-opsec','OPSEC'], critical: ['tag-critical','KEY'] };
  const [cls, label] = map[tag] || ['',''];
  return `<span class="tag ${cls}">${label}</span>`;
}

function renderExtCard(ext) {
  return `<div class="ext-card">
    <div class="ext-name">
      <span>${ext.name}</span>
      <a class="ext-link" href="${ext.url}" target="_blank">INSTALL ↗</a>
    </div>
    <div class="ext-desc">${ext.desc}</div>
    ${renderTag(ext.tag)}
  </div>`;
}

function filterExtensions(extensions) {
  if (!searchQuery) return extensions;
  const q = searchQuery.toLowerCase();
  return extensions.filter(e => 
    e.name.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q)
  );
}

function render() {
  const content = document.getElementById('main-content');
  let html = '<div class="section-label">// EXTENSION DATABASE INITIALIZED</div>';
  let totalShown = 0;

  const filteredDB = activeFilter === 'all' ? DB : DB.filter(c => c.cat === activeFilter);

  filteredDB.forEach(category => {
    const exts = filterExtensions(category.extensions);
    if (exts.length === 0) return;
    totalShown += exts.length;

    html += `<div class="category-block" data-cat="${category.cat}">
      <div class="category-header" onclick="toggleCat(this)">
        <span class="cat-icon">${category.icon}</span>
        <span class="cat-name">${category.catLabel}</span>
        <span class="cat-count">${exts.length}</span>
        <span class="toggle-arrow">▼</span>
      </div>
      <div class="ext-grid">
        ${exts.map(renderExtCard).join('')}
      </div>
    </div>`;
  });

  if (totalShown === 0) {
    html += `<div class="no-results">&gt; NO RESULTS FOUND // REFINE QUERY</div>`;
  }

  content.innerHTML = html;

  const countEl = document.getElementById('total-count');
  if (countEl) countEl.textContent = totalShown;
}

function toggleCat(header) {
  const grid = header.nextElementSibling;
  const isCollapsed = header.classList.contains('collapsed');
  if (isCollapsed) {
    header.classList.remove('collapsed');
    grid.style.maxHeight = '';
  } else {
    header.classList.add('collapsed');
    grid.style.maxHeight = '0';
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.cat;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

render();
</script>
